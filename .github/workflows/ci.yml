name: build

# GitHub-hosted runners have no NVIDIA GPU, so this workflow only verifies
# that the project *compiles* against the CUDA toolkit (host + device code).
# It cannot run the renderer. Runtime correctness checks happen locally
# against the RTX 5070 dev machine — see docs/ARCHITECTURE.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        id: cuda-toolkit
        with:
          cuda: '12.6.0'
          method: network

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake --preset release
          -DCMAKE_CUDA_ARCHITECTURES=89
        # 89 (Ada) chosen as a widely-available compile target for CI only;
        # local dev builds use `native` and target the RTX 5070 directly.

      - name: Build
        run: cmake --build --preset release
